<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RouteOn 관제</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1e3a5f;
      --primary-dark: #152d4a;
      --primary-light: #2d5080;
      --sidebar-w: 220px;
      --header-h: 56px;
      --body-bg: #f4f6f9;
      --panel: #ffffff;
      --text: #1a1a2e;
      --text-muted: #5c6478;
      --border: #dde3ec;
      --accent: #2563eb;
      --success: #15803d;
      --warning: #b45309;
      --danger: #b91c1c;
      --shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { font-size: 14px; }
    body {
      font-family: 'Noto Sans KR', system-ui, sans-serif;
      background: var(--body-bg);
      color: var(--text);
      min-height: 100vh;
      min-width: 1280px;
    }
    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: var(--sidebar-w);
      background: linear-gradient(180deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: #e8eef8;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }
    .brand {
      padding: 18px 16px;
      font-weight: 700;
      font-size: 16px;
      border-bottom: 1px solid rgba(255,255,255,.12);
    }
    .brand small { display: block; font-size: 11px; font-weight: 400; opacity: .75; margin-top: 4px; }
    .nav-main { padding: 12px 8px; flex: 1; }
    .nav-item {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: #c5d4e8;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
    }
    .nav-item:hover { background: rgba(255,255,255,.08); color: #fff; }
    .nav-item.active { background: rgba(255,255,255,.15); color: #fff; }
    .nav-sub { padding: 4px 8px 12px 20px; display: none; }
    .nav-sub.open { display: block; }
    .nav-sub button {
      display: block;
      width: 100%;
      text-align: left;
      border: none;
      background: transparent;
      color: #a8bdd8;
      font-family: inherit;
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .nav-sub button:hover, .nav-sub button.active { color: #fff; background: rgba(255,255,255,.1); }
    .shell { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .header {
      height: var(--header-h);
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      box-shadow: var(--shadow);
    }
    .header h1 { font-size: 15px; font-weight: 600; color: var(--primary); }
    .header-meta { display: flex; align-items: center; gap: 20px; font-size: 13px; color: var(--text-muted); }
    .header-meta strong { color: var(--text); }
    .content { flex: 1; padding: 20px 24px; overflow: auto; }
    .page { display: none; }
    .page.active { display: block; }
    .page-title { font-size: 18px; font-weight: 700; margin-bottom: 4px; }
    .page-desc { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    .card-hd {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .card-hd h2 { font-size: 14px; font-weight: 600; }
    .card-bd { padding: 16px; }
    .toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    input, select, textarea {
      font-family: inherit;
      font-size: 13px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(37,99,235,.15);
    }
    input.invalid { border-color: var(--danger); box-shadow: 0 0 0 2px rgba(185,28,28,.12); }
    .search { width: 220px; }
    .btn {
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      color: var(--text);
    }
    .btn:hover { background: #f8fafc; }
    .btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn-primary:hover { background: var(--primary-light); }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: #f8fafc; font-weight: 600; color: var(--text-muted); font-size: 12px; }
    tbody tr { cursor: pointer; transition: background .1s; }
    tbody tr:hover { background: #f0f4fa; }
    tbody tr.selected { background: #e8f0fe; }
    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-ok { background: #dcfce7; color: var(--success); }
    .badge-warn { background: #fef3c7; color: var(--warning); }
    .badge-info { background: #dbeafe; color: #1d4ed8; }
    .badge-muted { background: #f1f5f9; color: var(--text-muted); }
    .badge-run { background: #e0e7ff; color: #4338ca; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 12px;
      cursor: pointer;
    }
    .chip.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .pagination button {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .pagination button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .pagination span { font-size: 12px; color: var(--text-muted); margin: 0 8px; }
    .tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
    .tab {
      padding: 10px 16px;
      border: none;
      background: none;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
    }
    .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .form-grid { display: grid; grid-template-columns: 120px 1fr; gap: 12px 16px; max-width: 520px; align-items: center; }
    .form-grid label { font-size: 13px; color: var(--text-muted); }
    .split { display: grid; grid-template-columns: 1fr 340px; gap: 16px; }
    @media (max-width: 1400px) { .split { grid-template-columns: 1fr; } }
    .map-placeholder {
      height: 280px;
      background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 50%, #94a3b8 100%);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
    }
    .map-placeholder::after {
      content: '지도 영역 (목업)';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      font-weight: 600;
      font-size: 14px;
    }
    .map-pin {
      position: absolute;
      width: 12px; height: 12px;
      background: var(--danger);
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 2px 4px rgba(0,0,0,.3);
    }
    .driver-panel { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #f8fafc; }
    .driver-list { max-height: 320px; overflow-y: auto; }
    .driver-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .driver-row:hover { background: #fff; }
    .driver-row.picked { border-color: var(--accent); background: #eff6ff; }
    .route-box {
      margin-top: 12px;
      padding: 12px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      display: none;
    }
    .route-box.show { display: block; }
    .route-list { list-style: none; margin: 8px 0; }
    .route-list li {
      padding: 6px 0;
      border-bottom: 1px dashed var(--border);
      font-size: 13px;
    }
    .route-list li:last-child { border-bottom: none; }
    .route-svg { width: 100%; height: 60px; margin-top: 8px; }
    .contract-hint {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 8px;
      cursor: help;
      text-decoration: underline dotted;
    }
    .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      box-shadow: var(--shadow);
    }
    .stat-card .num { font-size: 28px; font-weight: 700; color: var(--primary); }
    .stat-card .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.45);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 24px;
    }
    .overlay.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 10px;
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,.2);
    }
    .modal-lg { max-width: 560px; }
    .modal-hd {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-hd h3 { font-size: 16px; }
    .modal-bd { padding: 20px; }
    .modal-ft {
      padding: 12px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
    .modal-close {
      border: none; background: none;
      font-size: 22px; cursor: pointer; color: var(--text-muted); line-height: 1;
    }
    .drawer-overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.35);
      z-index: 900;
      display: none;
    }
    .drawer-overlay.open { display: block; }
    .drawer {
      position: fixed;
      top: 0; right: 0;
      width: 400px;
      max-width: 100%;
      height: 100%;
      background: #fff;
      box-shadow: -4px 0 24px rgba(0,0,0,.15);
      z-index: 901;
      transform: translateX(100%);
      transition: transform .25s ease;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-hd { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .drawer-bd { flex: 1; overflow: auto; padding: 16px 20px; }
    .drawer-ft { padding: 12px 20px; border-top: 1px solid var(--border); }
    .toast {
      position: fixed;
      bottom: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--primary);
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      z-index: 2000;
      opacity: 0;
      transition: transform .3s, opacity .3s;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .footer {
      padding: 10px 24px;
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      background: #fff;
    }
    .loading { display: inline-block; width: 14px; height: 14px; border: 2px solid #fff; border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-hint { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; }
    .loc-list { list-style: none; }
    .loc-list li {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .coord { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); }
    .info-banner {
      background: #fef3c7;
      border: 1px solid #fcd34d;
      color: #92400e;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .stepper {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      padding: 12px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    .stepper .step {
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: #f1f5f9;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .stepper .step.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .stepper .step.done { background: #e8f0fe; color: var(--primary); border-color: #bfdbfe; }
    .link-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; margin-bottom: 20px; max-width: 960px; }
    .link-card {
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
    }
    .link-card:hover { border-color: var(--accent); box-shadow: 0 4px 12px rgba(30,58,95,.12); }
    .link-card h3 { font-size: 14px; margin-bottom: 4px; color: var(--primary); }
    .link-card p { font-size: 12px; color: var(--text-muted); }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 1200px) { .two-col { grid-template-columns: 1fr; } }
    .checklist { list-style: none; }
    .checklist li {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      margin-bottom: 8px;
      background: #fafbfc;
    }
    .checklist li.unavail { opacity: .55; background: #f1f5f9; }
    .checklist label { cursor: pointer; flex: 1; font-size: 13px; }
    .checklist small { display: block; color: var(--text-muted); font-size: 11px; margin-top: 2px; }
    .assign-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .assign-col-hd { font-size: 13px; font-weight: 600; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .map-marker {
      position: absolute;
      width: 22px; height: 22px;
      background: var(--primary);
      color: #fff;
      border: 2px solid #fff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,.25);
      z-index: 1;
    }
    .map-placeholder.has-markers::after { content: '지도 · 방문 노드 (목업)'; font-size: 12px; }
    .preview-meta { font-size: 12px; color: var(--text-muted); margin-top: 8px; }
    .preview-meta strong { color: var(--text); }
    .handoff-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 16px;
      background: #f0f9ff;
      border: 1px solid #bae6fd;
      border-radius: 8px;
      margin-top: 8px;
    }
    .section-anchor { scroll-margin-top: 12px; }
    .stat-grid-6 { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
    @media (max-width: 1400px) { .stat-grid-6 { grid-template-columns: repeat(3, 1fr); } }
    .stat-card.compact { padding: 12px 14px; }
    .stat-card.compact .num { font-size: 22px; }
    .filter-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
    .filter-bar label { font-size: 12px; color: var(--text-muted); margin-right: 4px; }
    .trip-row { cursor: pointer; }
    details.dev-collapse {
      margin-top: 20px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      padding: 0 12px;
      background: #f8fafc;
    }
    details.dev-collapse summary {
      padding: 10px 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
    }
    details.dev-collapse .dev-hidden {
      padding: 0 4px 12px;
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.6;
    }
    .sec-label {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: #e8f0fe;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    .visit-ol { margin: 0; padding-left: 20px; font-size: 13px; }
    .visit-ol li { padding: 4px 0; }
    .dispatch-mode-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding: 4px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 720px;
    }
    .dispatch-mode-nav button {
      flex: 1;
      min-width: 140px;
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: 6px;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      color: var(--text-muted);
    }
    .dispatch-mode-nav button:hover { background: #f8fafc; color: var(--text); }
    .dispatch-mode-nav button.active {
      background: #e8f0fe;
      border-color: #bfdbfe;
      color: var(--primary);
    }
    .dispatch-mode-nav button strong { display: block; font-size: 13px; margin-bottom: 2px; }
    .dispatch-mode-nav button span { font-size: 11px; font-weight: 400; opacity: .85; }
    .dispatch-mode-nav button.prominent.active {
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5080 100%);
      color: #fff;
      border-color: var(--primary);
    }
    .dispatch-mode-nav button.prominent.active span { color: #dbeafe; }
    .badge-incomplete { background: #fce7f3; color: #9d174d; }
    .badge-beta { background: #ede9fe; color: #5b21b6; }
    .banner-api {
      background: #eff6ff;
      border: 1px solid #93c5fd;
      color: #1e40af;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.55;
      margin-bottom: 16px;
    }
    .banner-api strong { display: block; margin-bottom: 4px; font-size: 13px; }
    .status-badges { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
    .csv-area {
      width: 100%;
      min-height: 80px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      resize: vertical;
    }
    .chip.disabled {
      opacity: .45;
      cursor: not-allowed;
      text-decoration: line-through;
    }
    .departure-mode {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .departure-mode button {
      flex: 1;
      min-width: 220px;
      text-align: left;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      line-height: 1.45;
      color: var(--text-muted);
    }
    .departure-mode button strong { display: block; font-size: 13px; color: var(--text); margin-bottom: 2px; }
    .departure-mode button.active {
      border-color: var(--primary);
      background: #eff6ff;
      box-shadow: 0 0 0 1px var(--primary);
    }
    .departure-mode button.active strong { color: var(--primary); }
    #bulkDepotBlock.is-hidden { display: none; }
    .checklist .fleet-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
    }
    .checklist .fleet-meta .coord { font-size: 10px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .bulk-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      padding: 12px 14px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .bulk-summary span strong { font-size: 18px; color: var(--primary); margin-right: 4px; }

  function openModal(title, bodyHtml, onSave) {

    box.className = 'modal';
    box.innerHTML = `
      <div class="modal-hd"><h3>${title}</h3><button type="button" class="modal-close" data-close>&times;</button></div>

      </div>`;
    $('#modalOverlay').classList.add('open');
    box.querySelectorAll('[data-close]').forEach(b => b.onclick = closeModal);
    $('#modalSave').onclick = () => {
      const form = box.querySelector('form');
      if (form && !validateForm(form)) return;
      closeModal();
      if (onSave) onSave();
      else toast();
    };
  }

  function validateForm(form) {
    let ok = true;
    form.querySelectorAll('[required]').forEach(inp => {
      const invalid = !inp.value.trim();
      inp.classList.toggle('invalid', invalid);
      if (invalid) ok = false;
    });
    return ok;
  }

    }
    return `<div class="pagination">${btns}<span>${fakePage} / ${totalPages} 페이지 (목업)</span></div>`;
  }

  function bindPagination(container) {

        toast('페이지를 변경했습니다 (목업)');

      btn.dataset.main = group.id;
      btn.onclick = () => {
        currentMain = group.id;
        currentPage = group.pages[0].id;
        renderNav();
        renderPage();
      };
      nav.appendChild(btn);
      const sub = el('div', 'nav-sub' + (currentMain === group.id ? ' open' : ''));
      group.pages.forEach(p => {
        const sb = el('button', '', p.label);
        if (currentPage === p.id) sb.classList.add('active');
        sb.type = 'button';
        sb.onclick = (e) => { e.stopPropagation(); currentMain = group.id; currentPage = p.id; renderNav(); renderPage(); };
        sub.appendChild(sb);
      });
      nav.appendChild(sub);
    });
  }

  function getBulkDispatchRequestJson(mode) {
    const bd = DATA.bulkDispatch;
    const body = {
      profile: 'truck',
      time_limit_seconds: 30,
      nodes: [
        { name: 'ABC 강남', lat: 37.4979, lon: 127.0276, cargo_weight_kg: 120, latest_at: '2026-06-01T12:00:00+09:00' },
        { name: '일산 마트', lat: 37.6688, lon: 126.7694, cargo_weight_kg: 85, latest_at: '2026-06-01T11:30:00+09:00' },
        { name: '분당 센터', lat: 37.3947, lon: 127.1112, cargo_weight_kg: 200, latest_at: '2026-06-01T17:00:00+09:00' },
      ],
      vehicles: bd.vehicles.filter(v => v.available !== false).map(v => {
        const row = { name: v.label, max_load_kg: v.max_load_kg, end_policy: v.end_policy };
        if (mode === 'distributed') {
          row.start_lat = v.start_lat;
          row.start_lon = v.start_lon;
        }
        return row;
      }),
    };
    if (mode === 'depot') {
      body.depot_name = bd.depot.name;
      body.depot_lat = bd.depot.lat;
      body.depot_lon = bd.depot.lon;
    }
    return JSON.stringify({ endpoint: 'POST /optimize/dispatch', ...body }, null, 2);
  }

        const veh = bd.vehicles[i] || bd.vehicles[0];
        return {
          vehicle_id: veh?.id ?? i + 1,
          vehicle_label: p.label,
          driver: p.driver,
          end_policy: veh?.end_policy ?? 'open_end',
          route: p.visits.filter(v => v.kind !== 'rest').map((v, j) => ({
            seq: j + 1,
            name: v.text,
            lat: (veh?.start_lat ?? 37.45) + j * 0.01,
            lon: (veh?.start_lon ?? 126.70) + j * 0.03,
            type: v.kind === 'origin' ? 'start' : v.kind === 'end' ? 'end' : 'delivery',
          })),
          rest_stops: p.visits.filter(v => v.kind === 'rest').map(v => ({ name: v.text })),
          planned_km: parseInt(p.distance, 10),
          planned_min: p.duration,
        };
      }),
      unassigned_nodes: r.unassigned.map(u => ({
        label: u.name,

      setTimeout(() => {
        bulkDispatchRan = true;
        bulkDispatchTab = 0;
        toast('VRPTW 배차 계산 완료 (API 목업 · DB 미저장)');

        renderBulkDispatch(root);

  function renderDispatchAssign(root) {
    const stepClass = (n) => {
      if (!dispatchRan && n === 1) return 'active';
      if (!dispatchRan && n > 1) return '';
      if (dispatchRan && n <= 4) return 'done';
      if (dispatchRan && n === 4) return 'active';
      return n <= 3 ? 'done' : 'active';
    };
    const plans = DATA.dispatchPlans;
    const tabIdx = Math.min(dispatchPreviewTab, plans.length - 1);
    const plan = plans[tabIdx] || plans[0];

    root.innerHTML = `
      ${renderDispatchModeNav('dispatch-assign')}
      <h2 class="page-title">단건·수동 배차</h2>
      <p class="page-desc">운행 이전 — 배송 건 선택·배정·미리보기·기사 앱 전달 (통계 아님)</p>
      <div class="stepper" aria-label="배차 단계">
        <span class="step ${stepClass(1)}">1. 배송 건</span>
        <span class="step ${stepClass(2)}">2. 배차 범위</span>
        <span class="step ${stepClass(3)}">3. 배정</span>
        <span class="step ${dispatchRan ? 'done' : ''} ${!dispatchRan ? '' : 'active'}">4. 결과·전달</span>
      </div>

      <div class="card section-anchor" id="sec-dispatch-orders">
        <div class="card-hd">
          <div><span class="sec-label">1</span><h2>배송 건 입력·목록</h2></div>

        </div>
        <div class="card-bd" style="padding:0">
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" id="chkAllDispatch" checked aria-label="전체 선택"></th>
                <th>상차</th><th>하차</th><th>화주</th><th>화물</th><th>연락처</th><th>희망 도착 (latest_at)</th>
              </tr>
            </thead>
            <tbody>
              ${DATA.dispatchOrders.map(o => `
                <tr>
                  <td><input type="checkbox" class="dispatch-chk" checked data-id="${o.id}"></td>
                  <td>${o.pickup}</td><td>${o.delivery}</td><td>${o.shipper}</td>
                  <td>${o.cargo}</td><td>${o.contact}</td><td>${o.latestAt}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card section-anchor" id="sec-dispatch-scope">
        <div class="card-hd"><div><span class="sec-label">2</span><h2>배차 범위 지정</h2></div></div>
        <div class="card-bd">
          <div class="toolbar">
            <label>배차 일자</label><input type="date" value="2026-06-01">
            <label>권역</label>
            <select><option>수도권</option><option>경기 남부</option><option>인천·김포</option></select>
            <label>센터</label>
            <select><option>본사 물류센터</option><option>인천 허브</option><option>성남 거점</option></select>
          </div>
        </div>
      </div>

      <div class="card section-anchor" id="sec-dispatch-fleet">
        <div class="card-hd">
          <div><span class="sec-label">3</span><h2>가용 차량·기사</h2></div>
          <button type="button" class="btn btn-primary" id="runDispatch">배차 실행</button>
        </div>
        <div class="card-bd">
          <ul class="checklist" id="fleetChecklist">
            ${DATA.dispatchFleet.map(f => `
              <li class="${f.available ? '' : 'unavail'}">
                <input type="checkbox" id="fleet-${f.id}" ${f.available ? 'checked' : ''} ${f.available ? '' : 'disabled'}>
                <label for="fleet-${f.id}">
                  <strong>${f.vehicle}</strong> · ${f.driver}
                  <small>${f.available ? '오늘 배차 가능' : (f.note || '가용 불가')}</small>
                </label>
              </li>`).join('')}
          </ul>

      </div>

              ${plans.map((p, i) => `
                <button type="button" class="tab ${i === tabIdx ? 'active' : ''}" data-vtab="${i}">${p.vehicle} · ${p.driver}</button>`).join('')}

            <div class="split" style="margin-top:12px">

                <p class="preview-meta"><strong>계획 소요</strong> ${plan.duration} · <strong>거리</strong> ${plan.distance}<br>

            <button type="button" class="btn btn-sm" id="manualReassign" ${dispatchRan ? '' : 'disabled'}>수동 재배정</button>

          <div>
            <div class="assign-col-hd"><span class="badge badge-warn">미배정</span> ${DATA.dispatchUnassigned.length}건</div>
            <ul class="route-list">
              ${DATA.dispatchUnassigned.map(u => `<li>${u.id} ${u.label}<br><small style="color:var(--text-muted)">${u.reason}</small></li>`).join('')}

          </div>
        </div>

          <div class="form-grid" style="max-width:100%">
            <label>상차 *</label><input required>
            <label>하차 *</label><input required>
            <label>화주</label><input>
            <label>화물</label><input>
            <label>연락처</label><input>
            <label>희망 도착</label><input type="datetime-local">
          </div>
        </form>`, () => toast('배송 건이 추가되었습니다 (목업)'));

  function openTripStatsDrawer(t) {
    const safetyHtml = t.safety === '주의'
      ? '<span class="badge badge-warn">주의</span>'
      : t.safety === '적합'
        ? '<span class="badge badge-ok">적합</span>'
        : '<span class="badge badge-muted">—</span>';
    openDrawer(`Trip ${t.id}`, `
      <p style="font-size:12px;color:var(--text-muted);margin-bottom:12px">${t.date} · ${t.driver} · ${t.status}</p>
      <h4 style="font-size:13px;margin-bottom:8px">안전 점검</h4>
      <p style="margin-bottom:16px">${safetyHtml}</p>
      <h4 style="font-size:13px;margin-bottom:8px;color:var(--text-muted)">머문 시간 (경영용 · 선택)</h4>
      <p style="font-size:13px">상차 체류: <strong>${t.dwellPickup}</strong><br>하차 체류: <strong>${t.dwellDelivery}</strong></p>
      <p style="font-size:11px;color:var(--text-muted);margin-top:12px">계획 vs 실제·재경로·휴게소 상세는 관제 화면에 표시하지 않습니다.</p>
    `, () => { closeDrawer(); });
    $('#drawerSave').textContent = '닫기';
  }

  function renderTripStats(root) {
    const s = DATA.statsSummary;
    const periodChips = ['일', '주', '월'];
    root.innerHTML = `
      <h2 class="page-title">운행 통계</h2>
      <p class="page-desc">운행 이후 — 완료 Trip 사후 통계·리포트 (가짜 데이터)</p>
      <div class="info-banner">관제 통계 — 계획 vs 실제 미노출 (팀 합의)</div>

      <div class="filter-bar card" style="padding:12px 16px;margin-bottom:16px">
        <span style="font-weight:600;font-size:13px">기간</span>
        <div class="chips" id="statsPeriodChips">
          ${periodChips.map(p => `<button type="button" class="chip ${statsPeriod === p ? 'active' : ''}" data-p="${p}">${p}</button>`).join('')}
        </div>
        <label>기사</label><select id="statsDriver"><option value="">전체</option>${DATA.drivers.map(d => `<option>${d.name}</option>`).join('')}</select>
        <label>차량</label><select id="statsVehicle"><option value="">전체</option>${DATA.vehicleStats.map(v => `<option>${v.plate}</option>`).join('')}</select>
        <label>권역</label><select><option>전체</option><option>수도권</option><option>경기</option></select>
        <button type="button" class="btn btn-sm btn-primary" id="statsApply">조회</button>
      </div>

      <div class="stat-grid-6">
        <div class="stat-card compact"><div class="num">${s.completed}</div><div class="lbl">완료 Trip</div></div>
        <div class="stat-card compact"><div class="num">${s.inProgress}</div><div class="lbl">진행 중</div></div>
        <div class="stat-card compact"><div class="num">${s.cancelled}</div><div class="lbl">취소</div></div>
        <div class="stat-card compact"><div class="num">${s.incomplete}</div><div class="lbl">미완료</div></div>
        <div class="stat-card compact"><div class="num">${s.assignedOk}</div><div class="lbl">배정 완료</div></div>
        <div class="stat-card compact"><div class="num">${s.assignedPending}</div><div class="lbl">미배정</div></div>
      </div>
      <div class="stat-card compact" style="margin-bottom:16px;max-width:240px">
        <div class="num" style="color:var(--warning)">${s.safetyIssues}</div>
        <div class="lbl">안전 이슈 Trip (주의 수준 포함)</div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>기사별 실적</h2></div>
        <div class="card-bd" style="padding:0">
          <table>
            <thead>
              <tr>
                <th>기사</th><th>완료 Trip</th><th>운행시간 합</th><th>운행시간 평균</th>
                <th>거리 합</th><th>거리 평균</th><th>운행 일수</th>
              </tr>
            </thead>
            <tbody>
              ${DATA.driverStats.map(d => `
                <tr class="trip-row" data-driver="${d.name}">
                  <td>${d.name}</td><td>${d.trips}</td><td>${d.hoursSum}</td><td>${d.hoursAvg}</td>
                  <td>${d.distSum}</td><td>${d.distAvg}</td><td>${d.days}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>차량별 실적</h2></div>
        <div class="card-bd" style="padding:0">
          <table>
            <thead><tr><th>차량</th><th>담당 기사</th><th>완료 Trip</th><th>운행시간 합</th><th>거리 합</th></tr></thead>
            <tbody>
              ${DATA.vehicleStats.map(v => `
                <tr><td>${v.plate}</td><td>${v.driver}</td><td>${v.trips}</td><td>${v.hoursSum}</td><td>${v.distSum}</td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>과거 경로 지도</h2></div>
        <div class="card-bd">
          <p class="page-desc" style="margin-bottom:8px">선택 기간·기사 Trip 궤적 (location_logs 연결선)</p>
          <div class="map-placeholder has-markers" style="height:260px">
            <span class="map-marker" style="left:22%;top:55%">S</span>
            <span class="map-marker" style="left:45%;top:40%;width:8px;height:8px;font-size:0">·</span>
            <span class="map-marker" style="left:62%;top:48%;width:8px;height:8px;font-size:0">·</span>
            <span class="map-marker" style="left:78%;top:32%;background:#15803d">E</span>
          </div>
          <p style="font-size:11px;color:var(--text-muted);margin-top:8px">목업: 실제 구현 시 location_logs 기반 폴리라인 표시</p>
        </div>
      </div>

      <div class="card">
        <div class="card-hd"><h2>Trip 목록</h2><span style="font-size:12px;color:var(--text-muted)">행 클릭 → 상세</span></div>
        <div class="card-bd" style="padding:0">
          <table>
            <thead><tr><th>Trip</th><th>기사</th><th>일자</th><th>상태</th><th>안전</th></tr></thead>
            <tbody>
              ${DATA.statsTrips.map(t => `
                <tr class="trip-row" data-trip="${t.id}">
                  <td>${t.id}</td><td>${t.driver}</td><td>${t.date}</td>
                  <td>${statusBadge(t.status)}</td>
                  <td>${t.safety === '주의' ? '<span class="badge badge-warn">주의</span>' : t.safety === '적합' ? '<span class="badge badge-ok">적합</span>' : '—'}</td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>

      <details class="dev-collapse">
        <summary>개발용 숨김 (내부·감사 — 관제 미노출)</summary>
        <div class="dev-hidden">
          계획 vs 실제 소요·거리 · 주행/휴게 상세 비교 · 재경로 횟수 · 휴게소 방문 횟수 — API·DB 집계만 사용, UI 미노출.
        </div>
      </details>`;

    root.querySelectorAll('#statsPeriodChips .chip').forEach(chip => {
      chip.onclick = () => { statsPeriod = chip.dataset.p; renderTripStats(root); };
    });
    $('#statsApply', root).onclick = () => toast(`조회: ${statsPeriod}간 필터 적용 (목업)`);
    root.querySelectorAll('tbody .trip-row[data-trip]').forEach(tr => {
      tr.onclick = () => {
        const t = DATA.statsTrips.find(x => x.id === tr.dataset.trip);
        if (t) openTripStatsDrawer(t);
      };
    });
    root.querySelectorAll('tbody .trip-row[data-driver]').forEach(tr => {
      tr.onclick = () => toast(`${tr.dataset.driver} 궤적을 지도에 표시 (목업)`);
    });
  }

  function renderOrderIntake(root) {
    const custOpts = DATA.customers.map(c => `<option>${c.name}</option>`).join('');
    const drivers = DATA.drivers.filter(d => d.status === '운행가능' || d.status === '운행중');
    root.innerHTML = `
      ${renderDispatchModeNav('order-intake')}
      <h2 class="page-title">접수 창</h2>
      <p class="page-desc">신규 배송 건 접수 — 상·하차, 화주, 화물, 희망 도착 (가짜 데이터)</p>
      <div class="split">
        <div class="card">
          <div class="card-hd"><h2>배송 건 정보</h2></div>
          <div class="card-bd">
            <form id="intakeForm">
              <div class="form-grid" style="max-width:100%;grid-template-columns:100px 1fr">
                <label>화주(고객) *</label><select required>${custOpts}</select>
                <label>상차지 *</label><input required placeholder="주소 또는 지점명">
                <label>하차지 *</label><input required placeholder="주소 또는 지점명">
                <label>희망 도착</label>
                <input type="datetime-local" aria-label="희망 도착 latest_at">
                <label>연락처</label><input placeholder="담당 연락처">
                <label>화물</label><textarea rows="2" placeholder="품목·수량·주의사항"></textarea>
              </div>
            </form>
            <div style="margin-top:16px;display:flex;gap:8px">
              <button type="button" class="btn btn-primary" id="submitOrder">접수 저장</button>
              <button type="button" class="btn" id="calcRoute">경로 계산</button>
            </div>
            <div class="route-box" id="routeBox">
              <strong>배차 미리보기</strong>
              <ol class="route-list" id="routeList"></ol>
              <svg class="route-svg" viewBox="0 0 300 60" preserveAspectRatio="none">
                <polyline points="10,50 80,30 150,45 220,20 290,35" fill="none" stroke="#1e3a5f" stroke-width="2" stroke-dasharray="4 2"/>
                <circle cx="10" cy="50" r="4" fill="#1e3a5f"/><circle cx="290" cy="35" r="4" fill="#15803d"/>
              </svg>
              <p class="contract-hint" title="optimize API: route[] 순서, 각 waypoint lat/lon, cargo_role pickup|delivery">API 계약: 방문 순서 · 위경도 · cargo_role (툴팁)</p>
            </div>
          </div>
        </div>
        <div class="driver-panel">
          <h3 style="font-size:14px;margin-bottom:10px">자기사 지정</h3>
          <input type="search" placeholder="기사 검색" style="width:100%;margin-bottom:8px" id="intakeDriverSearch">
          <div class="driver-list" id="intakeDrivers">
            ${drivers.map(d => `
              <div class="driver-row" data-id="${d.id}">
                <div><strong>${d.name}</strong><br><span style="font-size:11px;color:var(--text-muted)">${d.vehicle}</span></div>
                ${statusBadge(d.status)}
              </div>`).join('')}
          </div>
          <p style="font-size:11px;color:var(--text-muted);margin-top:8px">선택: <span id="pickedDriver">없음</span></p>
        </div>
      </div>`;

    root.querySelectorAll('.driver-row').forEach(row => {
      row.onclick = () => {
        root.querySelectorAll('.driver-row').forEach(r => r.classList.remove('picked'));
        row.classList.add('picked');
        selectedDriverId = Number(row.dataset.id);
        const d = DATA.drivers.find(x => x.id === selectedDriverId);
        $('#pickedDriver', root).textContent = d ? d.name : '없음';
      };
    });

    $('#submitOrder', root).onclick = () => {
      const form = $('#intakeForm', root);
      if (!validateForm(form)) return;
      toast('오더가 접수되었습니다 (목업)');
    };

    $('#calcRoute', root).onclick = () => {
      const btn = $('#calcRoute', root);
      const box = $('#routeBox', root);
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span>계산 중…';
      box.classList.remove('show');
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '경로 계산';
        const list = $('#routeList', root);
        list.innerHTML = DATA.routePreview.map(s => {
          const role = s.role ? ` <span class="badge badge-info">${s.role}</span>` : '';
          return `<li>${s.seq}. ${s.name}${role} <span class="coord">(${s.lat}, ${s.lon})</span></li>`;
        }).join('');
        box.classList.add('show');
        toast('경로 미리보기가 준비되었습니다');
      }, 1000);
    };

    $('#intakeDriverSearch', root).oninput = (e) => {
      const q = e.target.value.toLowerCase();
      root.querySelectorAll('.driver-row').forEach(row => {
        const text = row.textContent.toLowerCase();
        row.style.display = text.includes(q) ? '' : 'none';
      });
    };
    bindDispatchModeNav(root, 'order-intake');
  }

  function renderOrderList(root) {
    const statuses = ['전체', '접수', '배차', '운행중', '완료'];
    const rows = DATA.orders.filter(o => orderFilter === '전체' || o.status === orderFilter);
    root.innerHTML = `
      <h2 class="page-title">오더 목록</h2>
      <p class="page-desc">상태별 필터·조회</p>
      <div class="card">
        <div class="card-hd">
          <div class="chips" id="orderChips">
            ${statuses.map(s => `<button type="button" class="chip ${orderFilter === s ? 'active' : ''}" data-f="${s}">${s}</button>`).join('')}
          </div>
        </div>
        <div class="card-bd" style="padding:0">
          <table>
            <thead><tr><th>오더번호</th><th>고객</th><th>상차</th><th>하차</th><th>시간창</th><th>기사</th><th>상태</th></tr></thead>
            <tbody>${rows.map(o => `
              <tr><td>${o.id}</td><td>${o.customer}</td><td>${o.pickup}</td><td>${o.delivery}</td>
              <td>${o.window}</td><td>${o.driver || '—'}</td><td>${statusBadge(o.status)}</td></tr>`).join('')}
            </tbody>
          </table>
          ${paginationHtml(4)}
        </div>
      </div>`;
    root.querySelectorAll('#orderChips .chip').forEach(chip => {
      chip.onclick = () => { orderFilter = chip.dataset.f; renderOrderList(root); };
    });
    bindPagination(root);
  }

  function init() {
    const d = new Date();
    $('#headerDate').textContent = d.toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
    $('#drawerClose').onclick = closeDrawer;
    $('#drawerOverlay').onclick = closeDrawer;
    $('#modalOverlay').onclick = (e) => { if (e.target === $('#modalOverlay')) closeModal(); };
    renderNav();
    renderPage();
  }

  init();
})();
  </script>
</body>
</html>
